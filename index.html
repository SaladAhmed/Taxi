<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Transport PRO - Logg inn</title>
    <style>
        /* Naqshadda fudud ee bogga Login-ka (Transport PRO) */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0b2265;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 360px;
            text-align: center;
        }
        .logo {
            font-size: 48px;
            margin-bottom: 10px;
        }
        h2 {
            margin: 0 0 5px 0;
            color: #333;
        }
        p.subtitle {
            color: #777;
            font-size: 14px;
            margin: 0 0 30px 0;
        }
        .input-group {
            text-align: left;
            margin-bottom: 20px;
        }
        .input-group label {
            display: block;
            font-size: 14px;
            color: #555;
            margin-bottom: 5px;
            font-weight: 600;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }
        .btn-login {
            width: 100%;
            padding: 12px;
            background-color: #1a56db;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-login:hover {
            background-color: #1141a8;
        }
        .footer-links {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            font-size: 14px;
        }
        .footer-links a {
            color: #1a56db;
            text-decoration: none;
        }
        .error-message {
            color: #dc2626;
            font-size: 14px;
            margin-bottom: 15px;
            display: none;
        }
    </style>
</head>
<body>

<div class="login-container">
    <div class="logo">🚖</div>
    <h2>Transport PRO</h2>
    <p class="subtitle">Mohamed Salad Transport · Logg inn</p>
    
    <div id="errorMessage" class="error-message"></div>

    <form id="loginForm">
        <div class="input-group">
            <label for="email">E-post</label>
            <input type="email" id="email" placeholder="din@epost.no" required>
        </div>
        <div class="input-group">
            <label for="password">Passord</label>
            <input type="password" id="password" placeholder="********" required>
        </div>
        <button type="submit" class="btn-login">➡️ Logg inn</button>
    </form>

    <div class="footer-links">
        <a href="#">Glemt passord?</a>
        <a href="#">Ny? Registrer</a>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<script>
    // 2. Qaabaynta rasmiga ah ee mashruucaaga Firebase (Kaliya hal mar ayaa la sheegay)
    const firebaseConfig = {
        apiKey: "AIzaSyCYNLmTIEV2_WWNhibowhUCXzAMiMh0FYE",
        authDomain: "mohamed-salad-transport.firebaseapp.com",
        projectId: "mohamed-salad-transport",
        storageBucket: "mohamed-salad-transport.appspot.com",
        messagingSenderId: "608716442795",
        appId: "1:608716442795:web:ea17e2c3f26d3103717bee"
    };

    // Initialize Firebase
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }

    // 3. Shadaayada Login-ka iyo la tacaalida dhacdooyinka (Form Submission)
    const loginForm = document.getElementById('loginForm');
    const errorMessageDiv = document.getElementById('errorMessage');

    loginForm.addEventListener('submit', (e) => {
        e.preventDefault(); // Diid in boggu iska refresh gareeyo gudbinta ka dib
        
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        
        // Qari khaladaadkii hore haddii ay jireen
        errorMessageDiv.style.display = 'none';
        errorMessageDiv.innerText = '';

        // Habka login-ka Firebase
        firebase.auth().signInWithEmailAndPassword(email, password)
            .then((userCredential) => {
                // Markuu si sax ah u galo (U sii gudbi dashboard-ka)
                console.log("Guul! Waa la galay:", userCredential.user);
                window.location.href = "dashboard.html"; // Halkan ku qor bogga xiga ee dashboard-kaaga
            })
            .catch((error) => {
                // Haddii uu qalad dhaco, dadka u muuji qaladka
                console.error("Qalad ayaa dhacay:", error.message);
                errorMessageDiv.style.display = 'block';
                
                // Turjumaad fudud ee khaladaadka caanka ah
                if (error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') {
                    errorMessageDiv.innerText = "E-post-ka ama passord-ka ayaa khaldan.";
                } else if (error.code === 'auth/invalid-api-key') {
                    errorMessageDiv.innerText = "Cilad farsamo: API Key-ga Firebase ma shaqaynayo. Hubi Authorized Domains.";
                } else {
                    errorMessageDiv.innerText = error.message;
                }
            });
    });
</script>

</body>
</html>
