<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transport PRO - Nadiif ah</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root {
  --bg: #0b0f19;
  --card: #111827;
  --card-border: #1f2937;
  --text: #f3f4f6;
  --text-muted: #9ca3af;
  --green: #10b981;
  --green-bg: rgba(16, 185, 129, 0.1);
  --red: #ef4444;
  --red-bg: rgba(239, 68, 68, 0.1);
  --yellow: #f59e0b;
  --radius: 12px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; padding-bottom: 70px; }

.auth-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 2000; background: #0b0f19; }
.auth-card { background: #1e293b; border-radius: 16px; padding: 32px; width: 100%; max-width: 360px; text-align: center; border: 1px solid var(--card-border); }
.form-group { margin-bottom: 16px; text-align: left; }
.form-label { font-size: 11px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; display: block; text-transform: uppercase; }
.form-control { width: 100%; padding: 12px; background: #0f172a; border: 1.5px solid var(--card-border); color: #fff; border-radius: var(--radius); outline: none; }

.navbar { position: fixed; bottom: 0; left: 0; right: 0; height: 60px; background: var(--card); border-top: 1px solid var(--card-border); display: flex; justify-content: space-around; align-items: center; z-index: 1000; }
.nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-muted); cursor: pointer; font-size: 11px; font-weight: 500; gap: 4px; }
.nav-item.active { color: var(--text); }
.nav-item.active i { color: var(--yellow); }

.container { width: 100%; max-width: 600px; margin: 0 auto; padding: 16px; }
.top-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; gap: 10px; }
.btn-top { flex: 1; padding: 12px; border-radius: var(--radius); font-weight: 600; font-size: 12px; cursor: pointer; border: none; color: white; text-transform: uppercase; }
.btn-reset { background: #dc2626; }
.btn-logout { background: #4b5563; }

.kpi-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 12px; }
.kpi-card { background: var(--card); border: 1px solid var(--card-border); border-radius: var(--radius); padding: 12px; text-align: center; }
.kpi-title { font-size: 10px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 4px; }
.kpi-value { font-family: 'DM Mono', monospace; font-size: 13px; font-weight: 700; }
.kpi-card.inntekt .kpi-title { color: var(--green); }
.kpi-card.utgifter .kpi-title { color: var(--red); }

.result-card { background: var(--card); border: 2px solid var(--yellow); border-radius: var(--radius); padding: 20px; text-align: center; margin-bottom: 20px; }
.result-value { font-family: 'DM Mono', monospace; font-size: 26px; font-weight: 700; color: var(--green); }
.result-value.negative { color: var(--red); }

.tx-list { display: flex; flex-direction: column; gap: 10px; }
.tx-item { background: var(--card); border: 1px solid var(--card-border); border-radius: var(--radius); padding: 14px; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid var(--red); }
.tx-item.income { border-left-color: var(--green); }
.tx-info { display: flex; flex-direction: column; gap: 4px; }
.tx-desc { font-size: 13px; font-weight: 600; }
.tx-date { font-size: 11px; color: var(--text-muted); }
.tx-amount { font-family: 'DM Mono', monospace; font-size: 14px; font-weight: 700; color: var(--red); }
.tx-item.income .tx-amount { color: var(--green); }

/* NEW SMART PASTE AREA */
.paste-box { width: 100%; height: 180px; background: #0f172a; border: 2px dashed var(--card-border); border-radius: var(--radius); color: white; padding: 12px; font-family: 'DM Mono', monospace; font-size: 12px; resize: none; outline: none; margin-bottom: 12px; }
.btn-primary { background: var(--yellow); color: #0b0f19; border: none; padding: 14px; border-radius: var(--radius); width: 100%; font-weight: 700; cursor: pointer; text-transform: uppercase; font-size: 13px; }

.pg { display: none; }
.pg.active { display: block; }
</style>
</head>
<body>

<div id="pg-auth" class="auth-wrap">
  <div class="auth-card">
    <h2 style="color:#fff; font-size:20px; margin-bottom:20px;">Transport PRO Login</h2>
    <div class="form-group"><label class="form-label">E-post</label><input id="em" type="email" class="form-control" placeholder="magacaaga@epost.no"></div>
    <div class="form-group"><label class="form-label">Passord</label><input id="pw" type="password" class="form-control" placeholder="••••••••"></div>
    <button class="btn-primary" onclick="doLogin()">Logg Inn</button>
  </div>
</div>

<div id="app-body" style="display:none">
<div class="container">
  
  <div id="pg-dash" class="pg active">
    <div class="top-header">
      <button class="btn-top btn-reset" onclick="clearDatabase()"><i class="fas fa-trash-alt"></i> Slett xogta</button>
      <button class="btn-top btn-logout" onclick="doLogout()"><i class="fas fa-sign-out-alt"></i> Logg Ut</button>
    </div>
    
    <div class="kpi-grid">
      <div class="kpi-card inntekt"><div class="kpi-title">Inntekt</div><div class="kpi-value" id="kpi-in">0 kr</div></div>
      <div class="kpi-card utgifter"><div class="kpi-title">Utgifter</div><div class="kpi-value" id="kpi-out">0 kr</div></div>
      <div class="kpi-card netto"><div class="kpi-title">Netto</div><div class="kpi-value" id="kpi-net">0 kr</div></div>
    </div>

    <div class="result-card">
      <div style="font-size:11px; text-transform:uppercase; color:var(--text-muted); margin-bottom:4px;">Resultat før skatt</div>
      <div class="result-value" id="big-net">0 kr</div>
    </div>

    <div class="tx-list" id="transactions-container"></div>
  </div>

  <div id="pg-upload" class="pg">
    <h2 style="margin-bottom:12px; font-size:18px;">DNB Qoraal Geliye (Paste Text)</h2>
    <p style="font-size:12px; color:var(--text-muted); margin-bottom:12px;">Ku koobiyayso (Copy) dhamaan qoraalka ku jira PDF-kaaga DNB, ka dibna halkan ku dhex shub (Paste):</p>
    
    <textarea id="raw-paste-data" class="paste-box" placeholder='Ku shub qoraalka halkan... Tusaale: "23.01.26","26.01.26","Visa Tesla Inc.","35,05"'></textarea>
    <button class="btn-primary" onclick="processPastedText()">Hagaaji & Kaydi Xogta ✅</button>
  </div>

</div>

<nav class="navbar">
  <div class="nav-item active" id="btn-dash" onclick="switchPage('dash')"><i class="fas fa-chart-bar"></i>Dash</div>
  <div class="nav-item" id="btn-upload" onclick="switchPage('upload')"><i class="fas fa-paste"></i>Import Text</div>
</nav>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCYNLmTJEV2_WWNhIbpwbUCXzAMiMb0EYE",
  authDomain: "mohamed-salad-transport.firebaseapp.com",
  databaseURL: "https://mohamed-salad-transport-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "mohamed-salad-transport",
  storageBucket: "mohamed-salad-transport.firebasestorage.app",
  appId: "1:608716442795:web:34cafc1a233166641717bee"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const auth = firebase.auth();

const accountMeta = {
  "3030": { label: "Kjøreinntekter (Agder Taxi)", type: "income" },
  "7000": { label: "Visa Tesla Inc.", type: "expense" },
  "6907": { label: "Datakommunikasjon (Nextgentel)", type: "expense" },
  "7500": { label: "Forsikringspremie (DNB Livsforsikring)", type: "expense" },
  "6340": { label: "Lys og varme (Fortum / Vibb)", type: "expense" },
  "7770": { label: "Bank- og kortgebyr (Omkostninger)", type: "expense" },
  "5000": { label: "Santander Consumer Bank", type: "expense" },
  "5400": { label: "Skatt og Arbeidsgiveravgift (Skatteetaten)", type: "expense" }
};

function switchPage(pageId) {
  document.querySelectorAll('.pg').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById('pg-' + pageId).classList.add('active');
  document.getElementById('btn-' + pageId).classList.add('active');
}

function doLogin() {
  const em = document.getElementById('em').value;
  const pw = document.getElementById('pw').value;
  auth.signInWithEmailAndPassword(em, pw).catch(err => alert("Cilad: " + err.message));
}

function doLogout() {
  auth.signOut().then(() => { location.reload(); });
}

auth.onAuthStateChanged(user => {
  if (user) {
    document.getElementById('pg-auth').style.display = 'none';
    document.getElementById('app-body').style.display = 'block';
    listenToDatabase(user.uid);
  } else {
    document.getElementById('pg-auth').style.display = 'flex';
    document.getElementById('app-body').style.display = 'none';
  }
});

// ==================== COPIED TEXT PARSER (ZERO ERRORS) ====================
function processPastedText() {
  const rawText = document.getElementById('raw-paste-data').value;
  if (!rawText.trim()) return alert("Fadlan marka hore qoraalka ku shub sanduuqa!");

  let cleanText = rawText.replace(/\"/g, '');
  let lines = cleanText.split('\n');
  let extracted = [];

  lines.forEach(line => {
    let cleanLine = line.trim();
    if (!cleanLine) return;

    // Raadi taariikhda bilowga sadarka (DD.MM.YY)
    let dateMatch = cleanLine.match(/(\d{2})\.(\d{2})\.(\d{2})/);
    if (!dateMatch) return;

    let lineLower = cleanLine.toLowerCase();
    let detectedCat = null;

    if (lineLower.includes("agder taxi")) detectedCat = "3030";
    else if (lineLower.includes("tesla") || lineLower.includes("uno-x")) detectedCat = "7000";
    else if (lineLower.includes("nextgentel") || lineLower.includes("lyse")) detectedCat = "6907";
    else if (lineLower.includes("fortum") || lineLower.includes("vibb")) detectedCat = "6340";
    else if (lineLower.includes("forsikring") || lineLower.includes("dnb livsforsikring")) detectedCat = "7500";
    else if (lineLower.includes("omkostninger")) detectedCat = "7770";
    else if (lineLower.includes("santander")) detectedCat = "5000";
    else if (lineLower.includes("skatteetaten")) detectedCat = "5400";

    if (detectedCat) {
      // Soo saar dhamaan lacagaha u qaabaysan lacagta Noorwiijiga (,00 ama ,XX)
      let amounts = cleanLine.match(/(\d[\d\s.]*,\d{2})/g);
      if (amounts && amounts.length > 0) {
        let rawAmt = amounts[0];
        let cleanAmt = rawAmt.replace(/\s/g, '').replace(/\./g, '').replace(',', '.');
        let parsedAmt = parseFloat(cleanAmt);

        if (!isNaN(parsedAmt) && parsedAmt > 0) {
          let formattedDate = `20${dateMatch[3]}-${dateMatch[2]}-${dateMatch[1]}`;
          extracted.push({
            desc: accountMeta[detectedCat].label,
            amt: parsedAmt,
            subCat: detectedCat,
            mainCat: accountMeta[detectedCat].type,
            date: formattedDate
          });
        }
      }
    }
  });

  if (extracted.length === 0) {
    return alert("Wax xog xisaabeed ah lagama dhex helin qoraalka aad soo koobiyaysay! Hubi in taariikh iyo magac ganacsi ay ku jiraan.");
  }

  const currentUser = auth.currentUser;
  const userRef = db.ref('users/' + currentUser.uid + '/entries');
  
  userRef.remove().then(() => {
    let promises = extracted.map(entry => userRef.push(entry));
    Promise.all(promises).then(() => {
      alert(`Guul! ${extracted.length} transaksjoner ayaa si nadiif ah loo galiyay!`);
      document.getElementById('raw-paste-data').value = "";
      switchPage('dash');
    });
  });
}

function listenToDatabase(uid) {
  db.ref('users/' + uid + '/entries').on('value', snapshot => {
    let totalIn = 0, totalOut = 0;
    const container = document.getElementById('transactions-container');
    container.innerHTML = "";

    if (!snapshot.exists()) {
      container.innerHTML = `<div style="text-align:center; padding:40px; color:var(--text-muted);">Eber baa ku jira. Riix 'Import Text' si aad xog u geliso.</div>`;
      updateUI(0, 0, 0);
      return;
    }

    snapshot.forEach(child => {
      const item = child.val();
      if (item.mainCat === 'income') totalIn += item.amt;
      else totalOut += item.amt;

      container.innerHTML += `
        <div class="tx-item ${item.mainCat === 'income' ? 'income' : ''}">
          <div class="tx-info">
            <span class="tx-desc">${item.subCat} - ${item.desc}</span>
            <span class="tx-date">${item.date}</span>
          </div>
          <span class="tx-amount">${item.mainCat === 'income' ? '+' : ''}${item.amt.toLocaleString('no-NO', {minimumFractionDigits: 2})} kr</span>
        </div>
      `;
    });
    updateUI(totalIn, totalOut, totalIn - totalOut);
  });
}

function updateUI(inn, out, net) {
  document.getElementById('kpi-in').innerText = inn.toLocaleString('no-NO') + " kr";
  document.getElementById('kpi-out').innerText = out.toLocaleString('no-NO') + " kr";
  document.getElementById('kpi-net').innerText = net.toLocaleString('no-NO') + " kr";
  const bigNet = document.getElementById('big-net');
  bigNet.innerText = (net >= 0 ? "+" : "") + net.toLocaleString('no-NO', {minimumFractionDigits: 2}) + " kr";
  if (net < 0) bigNet.classList.add('negative'); else bigNet.classList.remove('negative');
}

function clearDatabase() {
  if (confirm("Ma hubtaa inaad dhamaan transaksiyonada tirtirto?")) {
    db.ref('users/' + auth.currentUser.uid + '/entries').set(null);
  }
}
</script>
</body>
</html>
