<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Transport PRO - Administrasjon</title>
    <style>
        /* Naqshaddii asalka ahayd ee nidaamkaaga (Dark theme oo cagaar leh) */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 900px;
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            border: 1px solid #334155;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #334155;
            padding-bottom: 20px;
        }
        h1 {
            color: #10b981;
            margin: 0;
            font-size: 28px;
        }
        .subtitle {
            color: #94a3b8;
            margin: 5px 0 0 0;
            font-size: 14px;
        }
        /* Qaybta PDF Upload-ka iyo Maamulka */
        .upload-section {
            background: #0f172a;
            border: 2px dashed #475569;
            padding: 30px;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            transition: border-color 0.3s;
            margin-bottom: 25px;
        }
        .upload-section:hover {
            border-color: #10b981;
        }
        .upload-section p {
            margin: 0;
            color: #94a3b8;
            font-size: 16px;
        }
        .file-input {
            display: none;
        }
        .btn {
            background-color: #10b981;
            color: #0f172a;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: #059669;
        }
        /* Qaybta Natiijada iyo Xogta PDF-ka ka soo baxda */
        .result-section {
            margin-top: 25px;
            background: #0f172a;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #334155;
        }
        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .result-title {
            color: #10b981;
            font-weight: bold;
            margin: 0;
        }
        pre {
            background: #1e293b;
            padding: 15px;
            border-radius: 6px;
            overflow-x: auto;
            color: #38bdf8;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
        }
        .error-msg {
            color: #ef4444;
            background: rgba(239, 68, 68, 0.1);
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ef4444;
            margin-bottom: 15px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🚖 Transport PRO</h1>
        <p class="subtitle">Mohamed Salad Transport — PDF-Leser & Administrasjon</p>
    </header>

    <div id="errorNotification" class="error-msg"></div>

    <div class="upload-section" onclick="document.getElementById('pdfFile').click()">
        <p>📂 Klikk her for å laste opp PDF-dokument (Kontoutskrift / Agder Taxi)</p>
        <input type="file" id="pdfFile" class="file-input" accept=".pdf" onchange="handleFileSelect(event)">
    </div>

    <div class="result-section">
        <div class="result-header">
            <p class="result-title">📊 Ekstraherte data fra PDF</p>
            <button class="btn" onclick="saveToFirebase()">💾 Lagre til Firebase</button>
        </div>
        <pre id="pdfContent">Ingen dokument er lastet opp ennå. Laste opp en PDF for å se innholdet her...</pre>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

<script>
    // 1. QAABEYNTA FIREBASE (Kaliya hal mar ayaa la sheegay si uusan qalad u dhacin)
    const firebaseConfig = {
        apiKey: "AIzaSyCYNLmTIEV2_WWNhibowhUCXzAMiMh0FYE",
        authDomain: "mohamed-salad-transport.firebaseapp.com",
        projectId: "mohamed-salad-transport",
        storageBucket: "mohamed-salad-transport.appspot.com",
        messagingSenderId: "608716442795",
        appId: "1:608716442795:web:ea17e2c3f26d3103717bee"
    };

    // Initialize Firebase
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const database = firebase.database();

    // U sheeg PDF.js meesha uu u soo kalsoonaan lahaa worker-ka
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    let extractedText = ""; // Meesha lagu keydinayo xogta rasmiga ah ee PDF-ka

    // 2. KOODHKA AKHRINTA PDF-KA (Kii rasmiga ahaa ee nidaamkaaga)
    function handleFileSelect(event) {
        const file = event.target.files[0];
        if (!file || file.type !== "application/pdf") {
            showError("Vennligst velg en gyldig PDF-fil.");
            return;
        }

        const fileReader = new FileReader();
        fileReader.onload = function() {
            const typedarray = new Uint8Array(this.result);

            pdfjsLib.getDocument(typedarray).promise.then(function(pdf) {
                let maxPages = pdf.numPages;
                let countPromises = [];
                
                for (let i = 1; i <= maxPages; i++) {
                    countPromises.push(
                        pdf.getPage(i).then(function(page) {
                            return page.getTextContent().then(function(textContent) {
                                return textContent.items.map(item => item.str).join(" ");
                            });
                        })
                    );
                }

                Promise.all(countPromises).then(function(texts) {
                    extractedText = texts.join("\n\n--- PAGE BREAK ---\n\n");
                    document.getElementById("pdfContent").textContent = extractedText;
                    document.getElementById("errorNotification").style.display = 'none';
                });
            }).catch(function(err) {
                showError("Kunne ikke lese PDF-filen: " + err.message);
            });
        };
        fileReader.readAsArrayBuffer(file);
    }

    // 3. BADHAMKA XOGTA LOOGU DIROY FIREBASE
    function saveToFirebase() {
        if (!extractedText || extractedText.startsWith("Ingen dokument")) {
            showError("Det er ingen data å lagre. Vennligst last opp en PDF først.");
            return;
        }

        // U dir xogta Firebase Database magac ahaan "transports_data" oo wata waqtiga la kaydiyay
        const dataRef = database.ref('transports_data/' + Date.now());
        dataRef.set({
            content: extractedText,
            timestamp: new Date().toISOString()
        }).then(() => {
            alert("✅ Dataene har blitt lagret i Firebase!");
        }).catch((error) => {
            showError("Firebase-feil: " + error.message);
        });
    }

    // Fariimaha khaladaadka lagu muujiyo
    function showError(message) {
        const errDiv = document.getElementById("errorNotification");
        errDiv.style.display = "block";
        errDiv.innerText = message;
    }
</script>

</body>
</html>
